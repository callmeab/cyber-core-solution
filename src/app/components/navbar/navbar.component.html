<nav
  class="fixed top-0 w-full z-50 transition-all duration-300 px-6 font-[family-name:var(--font-body)]"
  [ngClass]="isScrolled() ? 'bg-white/85 backdrop-blur-lg border-b border-line py-3' : 'bg-white/60 backdrop-blur-md py-4'"
>
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <!-- Left: Brand + links -->
    <div class="flex items-center gap-10">
      <div class="flex items-center gap-2 cursor-pointer group" (click)="scrollTo('hero')">
        <img class="w-8 h-8 object-contain" src="logo-only.svg" alt="CodeByte">
        <span class="font-[family-name:var(--font-display)] font-extrabold text-2xl tracking-tight text-ink">
          CodeByte<span class="text-[#1471f9]">.Tech</span>
        </span>
      </div>

      <div class="hidden md:flex items-center gap-7">
        <a
          *ngFor="let link of navLinks"
          (click)="scrollTo(link.id)"
          class="text-sm font-medium text-slate-soft hover:text-ink transition-colors cursor-pointer"
        >
          {{ link.label }}
        </a>
      </div>
    </div>

    <!-- Right: CTAs -->
    <div class="hidden md:flex items-center gap-3">
      <button (click)="scrollTo('portfolio')" class="btn-outline !py-2.5 !px-4">See our work</button>
      <button (click)="scrollTo('contact')" class="btn-navy !py-2.5 !px-4">Get a Quote</button>
    </div>

    <!-- Mobile Hamburger -->
    <button (click)="toggleMenu()" class="md:hidden text-ink p-2 focus:outline-none" aria-label="Toggle menu">
      <svg *ngIf="!isMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
      <svg *ngIf="isMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>

  <!-- Mobile Drawer -->
  <div
    class="md:hidden overflow-hidden transition-all duration-300 ease-in-out"
    [ngClass]="isMenuOpen() ? 'max-h-[480px] opacity-100 mt-4' : 'max-h-0 opacity-0'"
  >
    <div class="flex flex-col gap-1 py-4 px-2 bg-white rounded-2xl border border-line shadow-xl">
      <a
        *ngFor="let link of navLinks"
        (click)="scrollTo(link.id)"
        class="text-slate-soft hover:text-ink text-base font-medium py-2.5 px-4 transition-colors cursor-pointer"
      >
        {{ link.label }}
      </a>
      <button (click)="scrollTo('contact')" class="btn-navy mt-3 mx-3">Get a Quote</button>
    </div>
  </div>
</nav>
