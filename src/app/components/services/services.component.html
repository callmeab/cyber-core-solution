<section id="services" class="light-page on-navy grid-navy py-28 px-6 overflow-hidden">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-12 animate-on-scroll">
      <h2 class="h-display text-5xl md:text-6xl">
        One team. <span class="h-light">Your way.</span>
      </h2>
      <p class="text-lg text-[#9AA3C7] mt-5">Tell us what you need, and CodeByte adapts to how you work.</p>
    </div>

    <!-- Selector -->
    <div class="text-center mb-14 animate-on-scroll" style="transition-delay: 0.1s">
      <p class="text-xs font-bold tracking-[0.2em] text-[#9AA3C7] mb-4">— WE DO —</p>
      <div class="inline-flex flex-wrap justify-center gap-1 rounded-full border border-white/10 bg-white/5 p-1.5">
        <button
          *ngFor="let t of tabs"
          (click)="select(t.id)"
          class="flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold transition-all cursor-pointer"
          [ngClass]="activeId() === t.id ? 'bg-white/15 text-white ring-1 ring-white/30' : 'text-[#9AA3C7] hover:text-white'"
        >
          <span class="eyebrow-dot" [ngClass]="t.dot"></span>{{ t.label }}
        </button>
      </div>
    </div>

    <!-- Panel -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-14 items-center animate-on-scroll" style="transition-delay: 0.2s">
      <div>
        <h3 class="font-[family-name:var(--font-display)] font-extrabold text-3xl md:text-4xl text-white tracking-tight mb-8">
          {{ active().heading }}
        </h3>
        <ul class="space-y-4 mb-10">
          <li *ngFor="let p of active().points" class="flex items-start gap-3 text-[#C7CDE6]">
            <span class="mt-0.5 w-5 h-5 shrink-0 rounded-full bg-accent-blue/20 text-accent-blue text-[11px] font-bold flex items-center justify-center">✓</span>
            {{ p }}
          </li>
        </ul>
        <div class="flex flex-wrap gap-2 mb-8">
          <span *ngFor="let tag of active().tags" class="rounded-full border border-white/15 px-3 py-1 text-[11px] font-bold uppercase tracking-widest text-[#9AA3C7]">{{ tag }}</span>
        </div>
        <a (click)="scrollTo('contact')" class="link-arrow !text-white">Talk to us about it <span>→</span></a>
      </div>

      <!-- Mock window -->
      <div class="mock-card overflow-hidden">
        <div class="flex items-center gap-1.5 px-4 py-3 bg-paper border-b border-line">
          <span class="w-2.5 h-2.5 rounded-full bg-[#FF5F57]"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#FEBC2E]"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#28C840]"></span>
          <span class="ml-3 text-[11px] text-slate-soft">app.codebyte.tech/{{ active().id }}</span>
        </div>
        <div class="p-6 text-ink">
          <p class="text-[10px] font-bold tracking-widest uppercase text-accent-blue">{{ active().label }}</p>
          <p class="font-[family-name:var(--font-display)] font-extrabold text-2xl mb-5">{{ active().mock.title }}</p>
          <div class="space-y-3">
            <div *ngFor="let r of active().mock.rows" class="flex items-center justify-between rounded-xl border border-line p-4">
              <div>
                <p class="font-bold text-sm">{{ r.name }}</p>
                <p class="text-xs text-slate-soft">{{ r.meta }}</p>
              </div>
              <span class="rounded-full px-3 py-1 text-[11px] font-bold" [ngClass]="r.tone">●</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
